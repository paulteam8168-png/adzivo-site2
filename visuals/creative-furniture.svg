<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Sculptural furniture editorial</title><desc id="desc">Architectural premium living room with ivory lounge chair, warm walnut table, plants and luminous emerald ambience.</desc>
<defs>
