<radialGradient id="spot"><stop stop-color="#80FFD0" stop-opacity=".35"/><stop offset=".62" stop-color="#15A46C" stop-opacity=".09"/><stop offset="1" stop-color="#00301A" stop-opacity="0"/></radialGradient>
