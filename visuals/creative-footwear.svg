<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Futuristic athletic footwear advertising creative</title><desc id="desc">A dynamic floating silver and emerald running shoe with illuminated sole, layered motion trails and dark teal architectural graphics.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#051E22"/><stop offset=".41" stop-color="#020F13"/><stop offset="1" stop-color="#103334"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#4DFFE1" stop-opacity=".42"/><stop offset=".44" stop-color="#00BFB4" stop-opacity=".14"/><stop offset="1" stop-color="#002E29" stop-opacity="0"/></radialGradient>
<linearGradient id="upper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#EFFEF8"/><stop offset=".23" stop-color="#C9DAD7"/><stop offset=".52" stop-color="#78969B"/><stop offset=".71" stop-color="#E5FBF3"/><stop offset="1" stop-color="#30454C"/></linearGradient>
<linearGradient id="mesh" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#142C33"/><stop offset=".28" stop-color="#438B83"/><stop offset=".53" stop-color="#C1E0DA"/><stop offset=".78" stop-color="#1D3C44"/><stop offset="1" stop-color="#091E25"/></linearGradient>
<linearGradient id="sole" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#144C4A"/><stop offset=".21" stop-color="#AFFFF0"/><stop offset=".46" stop-color="#326E70"/><stop offset=".64" stop-color="#EEFFFC"/><stop offset=".85" stop-color="#5EE8CD"/><stop offset="1" stop-color="#144C4A"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143B3C"/><stop offset=".6" stop-color="#031317"/><stop offset="1" stop-color="#081B20"/></linearGradient>
<linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43FFF2" stop-opacity="0"/><stop offset=".46" stop-color="#7DFFDB"/><stop offset="1" stop-color="#34CDCF" stop-opacity="0"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="17"/></filter><filter id="glowB"><feGaussianBlur stdDeviation="9"/></filter>
<pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#8CFFF1" stroke-opacity=".09"/></pattern>
<pattern id="shoeMesh" width="14" height="14" patternUnits="userSpaceOnUse"><path d="m0 0 14 14M14 0 0 14" stroke="#DFFFFA" stroke-opacity=".15" stroke-width=".8"/></pattern>
</defs>
